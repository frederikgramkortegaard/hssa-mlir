name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # LLVM/MLIR 22 from apt.llvm.org. The dialect builds against the MLIR C++
      # API, so the major version must match what the sources target (22.x).
      - name: Install LLVM/MLIR 22
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y libmlir-22-dev mlir-22-tools llvm-22-dev clang-22 ninja-build
          python3 -m pip install --user lit

      - name: Configure
        run: |
          cmake -G Ninja -B build \
            -DMLIR_DIR=/usr/lib/llvm-22/lib/cmake/mlir \
            -DLLVM_EXTERNAL_LIT="$(python3 -m site --user-base)/bin/lit" \
            -DMLIR_INCLUDE_TESTS=ON \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22

      - name: Build
        run: cmake --build build

      - name: Test
        run: "$(python3 -m site --user-base)/bin/lit -v build/test"

  # The differential tests (make diff / diff-oo) and scripts/fuzz-gen.sh need the
  # Scala reference toolkit (sbt + hssa.jar) as the oracle. Left out of CI for
  # now; add as a second job once the reference build is cached.
